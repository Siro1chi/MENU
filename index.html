// === UTILS ===
function normalize(s) {
  return String(s).toLowerCase().replace(/ё/g, 'е')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[^\wа-яА-Я0-9]+/g, ' ')
    .trim().replace(/\s+/g, ' ');
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + cost);
    }
    prev = cur;
  }
  return prev[n];
}
function isMatch(u, c) {
  const nu = normalize(u), nc = normalize(c);
  if (!nu || !nc) return false;
  if (nu === nc) return true;
  const d = lev(nu, nc);
  const thresh = Math.max(1, Math.floor(Math.max(nu.length, nc.length) * 0.15));
  return d <= thresh;
}
function matchAnswers(user, correct) {
  const usedU = new Set(), usedC = new Set();
  const pairs = [];
  for (let i = 0; i < user.length; i++)
    for (let j = 0; j < correct.length; j++)
      if (isMatch(user[i], correct[j]))
        pairs.push({ i, j, d: lev(normalize(user[i]), normalize(correct[j])) });
  pairs.sort((a, b) => a.d - b.d);
  for (const p of pairs) {
    if (usedU.has(p.i) || usedC.has(p.j)) continue;
    usedU.add(p.i); usedC.add(p.j);
  }
  const userResults = user.map((u, i) => ({ text: u, ok: usedU.has(i) }));
  const miss = [];
  for (let j = 0; j < correct.length; j++) if (!usedC.has(j)) miss.push(correct[j]);
  const okCount = usedU.size;
  const missCount = miss.length;
  return { userResults, miss, okCount, missCount };
}
function splitIngredients(str) {
  if (!str) return [];
  const parts = []; let depth = 0, cur = '';
  for (const ch of str) {
    if (ch === '(' || ch === '[') depth++;
    else if (ch === ')' || ch === ']') depth--;
    if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  if (cur.trim()) parts.push(cur.trim());
  return parts.filter(Boolean);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

function renderCatPicker(mode) {
  const cats = Object.keys(DATA).map(name => {
    const arr = DATA[name];
    const count = mode === 1 ? arr.length : arr.filter(d => d.i).length;
    return { name, count };
  }).filter(c => c.count > 0);

  app.innerHTML = `
    <button class="back" data-act="back">‹ Назад</button>
    <h2>${mode === 1 ? 'Категория → блюда' : 'Блюдо → ингредиенты'}</h2>
    <div class="hint">${mode === 1 ? 'Выбери категорию' : 'Выбери категорию — пройдёшь все блюда с составом'}</div>
    ${cats.map(c => `
      <div class="card" data-cat="${esc(c.name)}">
        <div class="title">${esc(c.name)}</div>
        <div class="count">${c.count}</div>
      </div>`).join('')}
  `;
  app.querySelector('[data-act="back"]').onclick = () => { state.screen = 'home'; render(); };
  app.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => {
    state.category = el.dataset.cat;
    state.userAnswers = [];
    state.lastMatch = null;
    state.mode = mode;
    if (mode === 1) {
      state.screen = 'm1-test';
    } else {
      state.dishQueue = DATA[state.category].filter(d => d.i);
      state.dishIndex = 0;
      state.results = [];
      state.screen = 'm2-test';
    }
    render();
  });
}

// === input helpers ===
function attachInput(placeholder, onAdd, getBtnId) {
  const input = document.getElementById('input');
  const addBtn = document.getElementById('add');
  input.focus();
  const add = () => {
    const v = input.value.trim();
    if (!v) return;
    onAdd(v);
    input.value = '';
    updateChips();
    input.focus();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); add(); }
  };
  addBtn.onclick = add;
}
function updateChips() {
  const el = document.getElementById('answers');
  if (!el) return;
  el.innerHTML = state.userAnswers.map((a, i) =>
    `<div class="chip">${esc(a)}<span class="x" data-i="${i}">×</span></div>`).join('');
  el.querySelectorAll('.x').forEach(x => x.onclick = () => {
    state.userAnswers.splice(Number(x.dataset.i), 1);
    updateChips();
    document.getElementById('input').focus();
  });
}

// === MODE 1 ===
function renderTest1() {
  app.innerHTML = `
    <button class="back" data-act="back">‹ Назад</button>
    <div class="big-title">${esc(state.category)}</div>
    <div class="hint">Назови все блюда категории — в любом порядке</div>
    <div class="answers" id="answers"></div>
    <div class="input-row">
      <input type="text" id="input" placeholder="Название блюда..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <button class="add-btn" id="add">Добавить</button>
    </div>
    <button class="btn" id="done">Готово</button>
  `;
  attachInput('Название блюда...', v => state.userAnswers.push(v));
  document.getElementById('done').onclick = () => {
    const correct = DATA[state.category].map(d => d.d);
    state.lastMatch = matchAnswers(state.userAnswers, correct);
    state.screen = 'm1-result';
    render();
  };
  app.querySelector('[data-act="back"]').onclick = () => { state.screen = 'm1-cat'; render(); };
  updateChips();
}

function renderResult1() {
  const { userResults, miss, okCount, missCount } = state.lastMatch;
  const total = okCount + missCount;
  const pct = total ? Math.round(okCount / total * 100) : 0;
  const allOk = missCount === 0 && userResults.every(u => u.ok);
  app.innerHTML = `
    <div class="hint">${esc(state.category)}</div>
    <div class="big-title">Результат</div>
    <div class="score">
      <span class="ok-n">✓ ${okCount} правильных</span> ·
      <span class="miss-n">✗ ${missCount} неправильных</span>
      <div style="margin-top:4px">${pct}% из ${total}</div>
    </div>
    ${userResults.length ? `
      <div class="result-section">
        <h3 style="color:#1d1d1f">Твои ответы</h3>
        ${userResults.map(u => `
          <div class="answer-item ${u.ok ? 'ok' : 'miss'}">
            <span class="icon">${u.ok ? '✓' : '✗'}</span>
            <span>${esc(u.text)}</span>
          </div>`).join('')}
      </div>` : ''}
    ${miss.length ? `
      <div class="result-section">
        <h3 style="color:#1d1d1f">Не названо</h3>
        ${miss.map(m => `
          <div class="answer-item miss">
            <span class="icon">✗</span>
            <span>${esc(m)}</span>
          </div>`).join('')}
      </div>` : ''}
    ${allOk ? `<div class="verdict" style="background:#34c75922; color:#34c759">Идеально! Всё названо ✓</div>` : ''}
    <button class="btn" id="retry">Пройти ещё раз</button>
    <button class="btn secondary" id="toList">К категориям</button>
  `;
  document.getElementById('retry').onclick = () => {
    state.userAnswers = []; state.lastMatch = null;
    state.screen = 'm1-test'; render();
  };
  document.getElementById('toList').onclick = () => {
    state.lastMatch = null; state.screen = 'm1-cat'; render();
  };
}

// === MODE 2 ===
function renderTest2() {
  const dish = state.dishQueue[state.dishIndex];
  const total = state.dishQueue.length;
  app.innerHTML = `
    <button class="back" data-act="back">‹ Назад</button>
    <div class="hint">Блюдо ${state.dishIndex + 1} из ${total}</div>
    <div class="big-title">${esc(dish.d)}</div>
    <div class="hint">Назови все ингредиенты</div>
    <div class="answers" id="answers"></div>
    <div class="input-row">
      <input type="text" id="input" placeholder="Ингредиент..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <button class="add-btn" id="add">Добавить</button>
    </div>
    <button class="btn" id="done">Готово</button>
  `;
  attachInput('Ингредиент...', v => state.userAnswers.push(v));
  document.getElementById('done').onclick = () => {
    const correct = splitIngredients(dish.i);
    const match = matchAnswers(state.userAnswers, correct);
    state.lastMatch = match;
    state.results.push({ dish: dish.d, ok: match.okCount, miss: match.missCount });
    state.screen = 'm2-dish-result';
    render();
  };
  app.querySelector('[data-act="back"]').onclick = () => {
    if (state.userAnswers.length === 0 || confirm('Выйти из прохождения? Прогресс не сохранится.')) {
      state.screen = 'm2-cat';
      state.results = []; state.dishIndex = 0; state.userAnswers = [];
      render();
    }
  };
  updateChips();
}

function renderDishResult() {
  const dish = state.dishQueue[state.dishIndex];
  const isLast = state.dishIndex + 1 >= state.dishQueue.length;
  const { userResults, miss, okCount, missCount } = state.lastMatch;
  app.innerHTML = `
    <div class="hint">Блюдо ${state.dishIndex + 1} из ${state.dishQueue.length}</div>
    <div class="big-title">${esc(dish.d)}</div>
    <div class="score">
      <span class="ok-n">✓ ${okCount} правильных</span> ·
      <span class="miss-n">✗ ${missCount} неправильных</span>
    </div>
    ${userResults.length ? `
      <div class="result-section">
        <h3 style="color:#1d1d1f">Твои ответы</h3>
        ${userResults.map(u => `
          <div class="answer-item ${u.ok ? 'ok' : 'miss'}">
            <span class="icon">${u.ok ? '✓' : '✗'}</span>
            <span>${esc(u.text)}</span>
          </div>`).join('')}
      </div>` : ''}
    ${miss.length ? `
      <div class="result-section">
        <h3 style="color:#1d1d1f">Не названо</h3>
        ${miss.map(m => `
          <div class="answer-item miss">
            <span class="icon">✗</span>
            <span>${esc(m)}</span>
          </div>`).join('')}
      </div>` : ''}
    <button class="btn" id="next">${isLast ? 'К итогам раздела →' : 'Далее →'}</button>
  `;
  document.getElementById('next').onclick = () => {
    if (isLast) {
      state.screen = 'm2-final';
    } else {
      state.dishIndex++;
      state.userAnswers = [];
      state.lastMatch = null;
      state.screen = 'm2-test';
    }
    render();
  };
}

function renderFinal() {
  let totalOk = 0, totalMiss = 0;
  state.results.forEach(r => { totalOk += r.ok; totalMiss += r.miss; });
  const totalAll = totalOk + totalMiss;
  const pct = totalAll ? Math.round(totalOk / totalAll * 100) : 0;

  let verdict, color;
  if (pct === 100) { verdict = 'Раздел изучен полностью 🎉'; color = '#34c759'; }
  else if (pct >= 85) { verdict = 'Почти идеально — есть пара недочётов'; color = '#34c759'; }
  else if (pct >= 70) { verdict = 'Хороший результат, но стоит повторить'; color = '#ff9500'; }
  else if (pct >= 50) { verdict = 'Стоит подучить раздел'; color = '#ff9500'; }
  else { verdict = 'Раздел нужно учить заново'; color = '#ff3b30'; }

  app.innerHTML = `
    <div class="hint">${esc(state.category)}</div>
    <div class="big-title">Раздел пройден</div>
    <div class="score">
      Правильно: <b>${totalOk}</b> из ${totalAll} · ${pct}%
    </div>
    <div class="verdict" style="background:${color}22; color:${color}">${verdict}</div>
    <div class="result-section">
      <h3 style="color:#1d1d1f">По блюдам</h3>
      ${state.results.map(r => {
        const t = r.ok + r.miss;
        const p = t ? Math.round(r.ok / t * 100) : 0;
        const c = r.miss === 0 ? '#34c759' : p >= 60 ? '#ff9500' : '#ff3b30';
        return `<div class="dish-row">
          <div style="flex:1; padding-right:10px">${esc(r.dish)}</div>
          <div class="num" style="color:${c}">${r.ok}/${t}</div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn" id="retry">Пройти ещё раз</button>
    <button class="btn secondary" id="toList">К категориям</button>
  `;
  document.getElementById('retry').onclick = () => {
    state.dishIndex = 0; state.results = []; state.userAnswers = []; state.lastMatch = null;
    state.screen = 'm2-test'; render();
  };
  document.getElementById('toList').onclick = () => {
    state.results = []; state.dishIndex = 0; state.userAnswers = []; state.lastMatch = null;
    state.screen = 'm2-cat'; render();
  };
}

render();
</script>
